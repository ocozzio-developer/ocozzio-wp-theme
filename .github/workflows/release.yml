name: Release (beta)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: parent-release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: find ocozzio -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Version
        id: v
        run: |
          base=$(sed -n 's/^Version:[[:space:]]*\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' ocozzio/style.css)
          test -n "$base" || { echo "::error::No Version: line in ocozzio/style.css"; exit 1; }
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir -p build
          cp -R ocozzio build/
          sed -i "s/^Version:.*/Version: ${{ steps.v.outputs.version }}/" build/ocozzio/style.css
          (cd build && zip -qr ../ocozzio.zip ocozzio)

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" ocozzio.zip \
            --prerelease --title "v${{ steps.v.outputs.version }}" \
            --generate-notes --target "${{ github.sha }}"

      - name: Point the beta feed at it
        run: bash .github/feed.sh update-beta.json "${{ steps.v.outputs.version }}"
